га, не пункт ITV)"],EG=["Permiso de circulación and tarjeta ITV with you","Matrícula, VIN and make/model match the documents","VIN is legible and not corroded","Number plates fixed, legible and match the documents","Registered modifications (reforma) are legalised and on the documents","No serious corrosion on side members, cross members, floor and mounting points","No sharp protrusions or loose parts","Bumpers securely fixed","Bonnet closes and latches securely","Doors open and close; locks do not release by themselves","Fuel filler cap present and does not open by itself","No significant fluid leaks","Wiring undamaged and clear of hot or moving parts","Glass free of damage that impairs visibility","Mirrors present and intact","Wipers clear the glass and washer works","Seat belts fitted and working; buckles latch and release","Belt anchorages undamaged","Seats and mountings without dangerous play","No dangerous protruding parts inside","View not blocked by stickers or objects","Speedometer and odometer work","eCall (if fitted) has no faults","Dipped beam: both headlights","Main beam: both sides","Dipped/main beam switching works","Dipped beam aim is correct","Front and rear indicators work","Hazard lights work","Brake lights work","Number plate light works","Side lights work","Rear fog light (if required) works","Reversing lights work","Reflectors undamaged","Light colour is compliant","No unauthorised extra lamps/LEDs","Pedal does not sink","No pulling to one side when braking","No brake fluid leaks","Hoses and pipes free of damage and corrosion","Discs/drums in acceptable condition","Pads have enough material left","Parking brake holds the car","ABS has no fault","Brake/ABS warning light goes out after start","No loud grinding when braking","No excessive play in the steering wheel","Track rod ends and joints in good condition","Gaiters intact","No power steering leaks","Steering moves freely and self-centres","Car does not pull to one side","Shock absorbers without significant leaks","Springs not broken","No dangerous play in suspension","Ball joints and bushes in good condition","Wheels without cracks or deformation","Wheel nuts/bolts present and tight","Tyres match required size and rating","Tread not worn to indicators, no exposed cord","Sidewalls free of cuts, bulges, separation","Same tyre type on each axle","Pressure set to the placard","No significant oil leaks","No significant coolant leaks","No dangerous fuel leaks","Engine runs smoothly, no misfires","Exhaust intact and securely mounted","No excessive exhaust noise","Catalytic converter not removed or altered","No excessive smoke","Gearbox and drive shafts free of leaks/damage","No parts underneath that could fall off","Engine at normal temperature before measurement","Oil and filters serviced","No MIL / Check Engine light","No confirmed or permanent DTCs","Diagnostic socket accessible and working","Fault codes not cleared before the ITV","Petrol: CO and lambda checked","Diesel: smoke opacity and emission system checked","Xenon/LED replacing original bulbs is compliant","Window tint complies with the rules","Wheels and tyres within permitted parameters","Wheel spacers legalised or absent","Suspension lowering/lifting legalised","Tow bar documented and recorded for ITV","Spoilers, side skirts, bull bars do not create a reforma","No extra lights/LED bars fitted on your own","Exhaust changes legalised","Brakes/steering/suspension not modified without legalisation","Car, plates, headlights and tail lights washed","Pressure in all tyres and the spare","All bulbs checked","Wipers and washer checked","Oil and coolant levels","No fresh stains under the car","Check Engine/ABS/Airbag lights off","Pre-ITV check at a workshop if in doubt","No unnecessary load in the cabin","Documents for modifications kept with the car","V16: connected and certified (road requirement, not an ITV item)"],SU=["Документи та ідентифікація","Кузов і зовнішній стан","Салон і безпека","Освітлення та const sn=i=>[S[i][0],S[i][1],SU[i],SE[i]][L],gn=i=>[G[i][0],G[i][1],GU[i],GE[i]][L],TU=["Звірте matrícula та VIN з документами. Зміни без легалізації (reforma) — часта причина проблем.","Витоки та серйозна корозія силових елементів — основні ризики. За сумнівів зробіть пред-ITV перевірку в сервісі.","Перевірте замки та кріплення пасків. eCall не потрібно встановлювати заднім числом на старі авто.","Перевіряйте світло вдвох: один перемикає, другий обходить авто. Підсвітку номера й аварійку забувають найчастіше.","За сумнівів щодо гальм зробіть пред-ITV перевірку в сервісі до візиту на станцію.","Люфти та пильовики керма перевірте заздалегідь. За сумнівів — до сервісу.","Перед ITV виставте тиск за табличкою. Перевірте знос протектора й стан бічин.","Вихлоп, витоки та каталізатор: сумніви щодо вихлопу краще вирішити в сервісі до ITV.","Прогрійте двигун і не стирайте помилки перед ITV. Якщо горить MIL, спершу усуньте причину.","Будь-яка модифікація, що змінює характеристики авто, проходить як reforma. Документи на неї тримайте з авто.","Check Engine, ABS і Airbag мають не горіти. Не використовуйте ITV як діагностику."],TE=["Compare the matrícula and VIN with the documents. Modifications that were not legalised (reforma) are a common cause of problems.","Leaks and serious corrosion of structural parts are the main risks. If in doubt, get a pre-ITV check at a workshop.","Check belt buckles and anchorages. You do not need to retrofit eCall on older cars.","Check the lights with two people: one operates, the other walks around the car. The number plate light and hazards are forgotten most often.","If you have doubts about the brakes, get a pre-ITV check at a workshop before going to the station.","Check steering play and gaiters in advance. If in doubt, go to a workshop.","Set the pressure to the placard before the ITV. Check tread wear and sidewall condition.","Exhaust, leaks and catalytic converter: it is better to settle any exhaust doubts at a workshop before the ITV.","Warm up the engine and do not clear fault codes before the ITV. If the MIL is on, fix the cause first.","Any modification that changes the car's characteristics is treated as a reforma. Keep its documents with the car.","Check Engine, ABS and Airbag lights must be off. Do not use the ITV as a diagnostic."],DU=["Увімкніть запалювання та по черзі всі режими світла, поки друга людина обходить авто.|Перевірте ближнє, дальнє, габарити, стопи (помічник тисне педаль або дивіться відображення в стіні), повороти, аварійку, задній хід і підсвітку номера.|Перевірте цілісність фар і колір світла; перегорілі лампи краще міняти парою.","Огляньте всі шини, включно із запаскою: порізи, грижі, тріщини, сторонні предмети.|Знайдіть індикатори зносу в канавках протектора; законний мінімум — 1,6 мм. Порівняйте знос усередині та ззовні.|Звірте розмір та індекс на бічині з документами й виміряйте тиск на холодних шинах за табличкою.","На рівному майданчику натисніть педаль: вона має бути пружною, без провалу й не йти до підлоги.|Перевірте рівень гальмівної рідини в бачку та сліди підтікань біля коліс.|На безпечній ділянці на малій швидкості загальмуйте: чи немає зносу вбік, вібрації, скреготу. Ручник на підйомі має утримувати авто. Горить ABS — до сервісу.","Натисніть на кожен кут кузова й відпустіть: він має повернутися за одне коливання, без стуку.|Огляньте амортизатори (масляні підтікання — ознака витоку) та пружини на тріщини.|Для перевірки люфту коліс авто піднімають і ставлять на підставки (не працюйте під домкратом). Люфт або стук — до сервісу.","На нерухомому авто з працюючим двигуном покрутіть кермо: вільний хід не має бути великим.|Поверніть кермо до упорів: без заїдань, скрипу й масляних підтікань гідропідсилювача.|На рівній дорозі стежте, чи немає тяги вбік і чи повертається кермо після повороту.","Огляньте лобове скло: тріщини й відколи в зоні огляду водія, наклейки.|Перевірте щітки (рвана гума, смуги) й омивач у всіх режимах.|Дзеркала цілі, регулюються й фіксуються.","Витягніть кожен пас до кінця й відпустіть: він має плавно втягуватися, стрічка без потертостей.|Застебніть і розстебніть кожен замок; різко смикніть пас — він має блокуватися.|Огляньте кріплення пасків і сидіння на люфт.","Обійдіть авто: гострі краї, відірвані частини, кріплення бамперів, капота й дверей.|Огляньте пороги, арки й днище (краще на підйомнику в сервісі) на наскрізну корозію, особливо на силових елементах.|Після стоянки подивіться під авто: плями оливи, антифризу, палива.","Прогрійте двигун, послухайте вихлоп на незвичний шум і подивіться на дим із труби.|Перевірте кріплення та цілісність глушника: прогари, тріщини.|Зчитайте помилки OBD сканером (підійде ELM327) і не стирайте їх перед ITV. Горить Check Engine — спершу усуньте причину.","Знайдіть permiso de circulación та tarjeta ITV; перевірте, що вони читаються й на ваше авто.|Звірте matrícula, VIN і марку/модель з авто (VIN на кузові або табличці).|Якщо були зміни (reforma), переконайтеся, що вони відображені в документах."],DE=["Switch on the ignition and go through every lighting mode while a second person walks around the car.|Check dipped beam, main beam, side lights, brake lights (a helper presses the pedal, or look at the reflection in a wall), indicators, hazards, reversing light and number plate light.|Check the headlights are intact and the colour is correct; it is better to replace bulbs in pairs.","Inspect all tyres, including the spare: cuts, bulges, cracks, objects stuck in the tread.|Find the wear indicators in the tread grooves; the legal minimum is 1.6 mm. Compare wear on the inside and outside.|Compare the size and rating on the sidewall with the documents and measure the pressure on cold tyres according to the placard.","On level ground press the pedal: it should feel firm, not sink and not go to the floor.|Check the brake fluid level in the reservoir and look for leaks near the wheels.|On a safe road at low speed brake: check for pulling, vibration and grinding. The parking brake on a slope must hold the car. If the ABS light is on, go to a workshop.","Press down on each corner of the body and release: it should return in one movement, without knocking.|Inspect the shock absorbers (oil stains mean a leak) and the springs for cracks.|To check wheel play the car is lifted and placed on stands (never work under a jack alone). Play or knocking: go to a workshop.","With the car stationary and the engine running turn the wheel: the free play should not be large.|Turn the wheel to full lock: no binding, squeaking or power steering oil leaks.|On a level road watch for pulling to one side and whether the wheel self-centres after a turn.","Inspect the windscreen: cracks and chips in the driver's field of view, stickers.|Check the wiper blades (torn rubber, streaks) and the washer in all modes.|Mirrors are intact, adjustable and stay in place.","Pull each belt out fully and release: it should retract smoothly and the webbing should not be frayed.|Buckle and unbuckle each belt; pull sharply on the belt: it should lock.|Check the belt anchorages and seats for play.","Walk around the car: sharp edges, loose parts, bumper, bonnet and door fixings.|Inspect sills, wheel arches and underbody (best on a workshop lift) for corrosion holes, especially on structural parts.|After parking look under the car: oil, coolant or fuel stains.","Warm up the engine, listen for unusual exhaust noise and watch for smoke.|Check the silencer mountings and condition: holes, cracks.|Read the OBD codes with a scanner (an ELM327 will do) and do not clear them before the ITV. If Check Engine is on, fix the cause first.","Find the permiso de circulación and tarjeta ITV; check they are legible and belong to your car.|Compare the matrícula, VIN and make/model with the car (VIN on the body or plate).|If there were modifications (reforma), confirm they are on the documents."];

["Включите зажигание и по очереди все режимы света, пока второй человек обходит автомобиль.|Проверьте ближний, дальний, габариты, стопы (помощник жмёт педаль или смотрите отражение в стене), повороты, аварийку, задний ход и подсветку номера.|Проверьте целостность фар и цвет света; перегоревшие лампы лучше менять парой.",
 "Active el contacto y los modos de luz uno a uno mientras otra persona rodea el coche.|Compruebe cruce, carretera, posición, freno (con ayuda o viendo el reflejo en una pared), intermitentes, emergencias, marcha atrás y luz de matrícula.|Revise que los faros estén íntegros y el color sea correcto; es mejor cambiar las lámparas por pares."],
["Осмотрите все шины, включая запаску: порезы, грыжи, трещины, посторонние предметы.|Найдите индикаторы износа в канавках протектора; законный минимум — 1,6 мм. Сравните износ внутри и снаружи.|Сверьте размер и индекс на боковине с документами и измерьте давление на холодных шинах по табличке.",
 "Revise todos los neumáticos, incluida la rueda de repuesto: cortes, hernias, grietas, objetos clavados.|Busque los testigos de desgaste en las ranuras; el mínimo legal es 1,6 mm. Compare el desgaste interior y exterior.|Compare medida e índice del flanco con los documentos y mida la presión en frío según la etiqueta."],
["На ровной площадке нажмите педаль: она должна быть упругой, без провала и не идти до пола.|Проверьте уровень тормозной жидкости в бачке и следы подтёков у колёс.|На безопасном участке на малой скорости затормозите: нет ли увода, вибрации, скрежета. Ручник на подъёме должен удерживать автомобиль. Горит ABS — в сервис.",
 "En terreno llano pise el pedal: debe ser firme, sin hundirse ni llegar al suelo.|Revise el nivel del líquido de frenos y busque goteos junto a las ruedas.|En un lugar seguro y a baja velocidad frene: sin desvíos, vibraciones ni chirridos. El freno de mano en cuesta debe sujetar el coche. Si se enciende el ABS, al taller."],
["Надавите на каждый угол кузова и отпустите: он должен вернуться за одно колебание, без стука.|Осмотрите амортизаторы (масляные подтёки — признак утечки) и пружины на трещины.|Для проверки люфта колёс автомобиль поднимают и ставят на подставки (не работайте под домкратом). Люфт или стук — в сервис.",
 "Presione cada esquina de la carrocería y suelte: debe volver en una oscilación, sin golpeteos.|Revise los amortiguadores (manchas de aceite indican fuga) y los muelles por grietas.|Para comprobar holguras de las ruedas se eleva el coche sobre caballetes (nunca solo con gato). Si hay holgura o golpeteo, al taller."],
["На стоящем автомобиле с работающим двигателем покрутите руль: свободный ход не должен быть большим.|Поверните руль до упоров: без заеданий, скрипа и масляных подтёков гидроусилителя.|На ровной дороге следите, нет ли тяги в сторону, и вернулся ли руль после поворота.",
 "Con el coche parado y el motor en marcha gire el volante: el juego libre no debe ser grande.|Gírelo hasta los topes: sin agarrotamientos, chirridos ni fugas de la dirección asistida.|En carretera llana observe si el coche se desvía y si el volante vuelve al centro tras girar."],
["Осмотрите лобовое стекло: трещины и сколы в зоне обзора водителя, наклейки.|Проверьте щётки (рваная резина, полосы) и омыватель во всех режимах.|Зеркала целы, регулируются и фиксируются.",
 "Revise el parabrisas: grietas y desconchones en el campo de visión, pegatinas.|Compruebe las escobillas (goma rota, rayas) y el lavaparabrisas en todos los modos.|Los espejos están enteros, se regulan y quedan fijos."],
["Вытяните каждый ремень до конца и отпустите: он должен плавно втягиваться, лямка без потёртостей.|Застегните и расстегните каждый замок; резко дёрните ремень — он должен блокироваться.|Осмотрите крепления ремней и сиденья на люфт.",
 "Extraiga cada cinturón por completo y suéltelo: debe recogerse con suavidad y la cinta sin desgaste.|Abroche y desabroche cada hebilla; tire de golpe del cinturón: debe bloquearse.|Revise anclajes de cinturones y asientos por holguras."],
["Обойдите автомобиль: острые края, оторванные части, крепление бамперов, капота и дверей.|Осмотрите пороги, арки и днище (лучше на подъёмнике в сервисе) на сквозную коррозию, особенно у силовых элементов.|После стоянки посмотрите под автомобилем: пятна масла, антифриза, топлива.",
 "Rodee el coche: bordes afilados, piezas sueltas, fijación de parachoques, capó y puertas.|Revise umbrales, pasos de rueda y bajos (mejor en elevador del taller) por corrosión pasante, sobre todo en elementos estructurales.|Tras aparcar mire debajo del coche: manchas de aceite, refrigerante o combustible."],
["Прогрейте двигатель, послушайте выхлоп на необычный шум и посмотрите на дым из трубы.|Проверьте крепления и целостность глушителя: прогары, трещины.|Считайте ошибки OBD сканером (подойдёт ELM327) и не стирайте их перед ITV. Горит Check Engine — сначала устраните причину.",
 "Caliente el motor, escuche ruidos raros del escape y observe el humo.|Revise fijaciones e integridad del silenciador: agujeros, grietas.|Lea los errores OBD con un escáner (vale un ELM327) y no los borre antes de la ITV. Si el Check Engine está encendido, corrija primero la causa."],
["Найдите permiso de circulación и tarjeta ITV; проверьте, что они читаются и на ваш автомобиль.|Сверьте matrícula, VIN и марку/модель с автомобилем (VIN на кузове или табличке).|Если были изменения (reforma), убедитесь, что они отражены в документах.",
 "Localice el permiso de circulación y la tarjeta ITV; compruebe que se leen y corresponden a su coche.|Compare matrícula, VIN y marca/modelo con el coche (VIN en la carrocería o placa).|Si hubo reformas, confirme que constan en la documentación."]
];

async function checkRulesUpdate(){
 const box=document.getElementById("rulesUpdateResult");
 if(!box)return;
 box.textContent="Проверяем опубликованный манифест…";
 try{
  const response=await fetch("./rules-manifest.json",{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  if(!data.rules_pack||!data.rules_pack.version)throw new Error("В манифесте отсутствует версия пакета правил");
  const remote=String(data.rules_pack.version), installed="7.9";
  const status=String(data.rules_pack.status||"unknown");
  const effective=String(data.rules_pack.effective_from||"не указана");
  const review=String(data.rules_pack.next_review_due||data.next_review_due||"не указана");
  let result="Манифест получен. Опубликованная версия: "+remote+"; вступает в силу: "+effective+". Статус: "+status+". Следующая проверка источников: "+review+". ";
  if(remote!==installed)result+="Есть различие с версией, встроенной в приложение ("+installed+"). Это уведомление, а не установка обновления.";
  else result+="Версия совпадает со встроенной ("+installed+"). Новые правила автоматически не применялись.";
  if(status!=="validated")result+=" Внимание: пакет не отмечен как полностью проверенный.";
  box.textContent=result;
 }catch(error){box.textContent="Не удалось проверить манифест: "+error.message+". Проверьте публикацию GitHub Pages и доступность rules-manifest.json.";}
}
